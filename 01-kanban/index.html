<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Transit Kanban</title><style>body{font:16px system-ui;background:#f3f6fb;padding:25px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.col{background:#e8edf5;padding:15px;border-radius:12px}.card{background:white;padding:12px;margin:10px 0;border-radius:8px}@media(max-width:650px){.board{grid-template-columns:1fr}}</style><h1>Transit booking · Kanban</h1><div id="board" class="board"></div><script>fetch('board.json').then(r=>r.json()).then(xs=>['To Do','In Progress','Done'].forEach(s=>{let c=document.createElement('section');c.className='col';c.innerHTML='<h2>'+s+'</h2>';xs.filter(x=>x.status===s).forEach(x=>{let d=document.createElement('div');d.className='card';d.innerHTML='<b>'+x.title+'</b><br>'+x.id+' · '+x.owner;c.append(d)});board.append(c)}))</script>
