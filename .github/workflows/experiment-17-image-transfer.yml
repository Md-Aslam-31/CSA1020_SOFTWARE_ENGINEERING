name: Experiment 17 - Publish and pull a website image

on:
  pull_request:
    paths:
      - experiments/experiment-17-dockerhub-image-transfer/**
      - .github/workflows/experiment-17-image-transfer.yml
  push:
    branches: [main]
    paths:
      - experiments/experiment-17-dockerhub-image-transfer/**
      - .github/workflows/experiment-17-image-transfer.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Define the immutable image reference
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/campusconnect-transfer:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and verify the local container
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/campusconnect-transfer:${GITHUB_SHA::7}"
          docker build -t "$image" experiments/experiment-17-dockerhub-image-transfer
          docker run -d --name campusconnect-transfer -p 127.0.0.1:8080:80 "$image"
          trap 'docker logs campusconnect-transfer || true; docker rm -f campusconnect-transfer >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q 'CampusConnect'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image from the source runner
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker push "$IMAGE"

  pull-on-separate-runner:
    if: github.event_name == 'push'
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run on the receiving runner
        env:
          IMAGE: ${{ needs.build-and-publish.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run -d --name campusconnect-received -p 127.0.0.1:8081:80 "$IMAGE"
          trap 'docker logs campusconnect-received || true; docker rm -f campusconnect-received >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8081/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8081/ | grep -q 'CampusConnect'
          echo "Verified transfer across two separate GitHub-hosted runners: $IMAGE"
