name: Experiment 19 - StudySpark test, build, publish
on:
  pull_request:
    paths:
      - experiments/experiment-16-flask-todo-docker/**
      - .github/workflows/experiment-19-cicd.yml
  push:
    branches: [main]
    paths:
      - experiments/experiment-16-flask-todo-docker/**
      - .github/workflows/experiment-19-cicd.yml
permissions:
  contents: read
  packages: write
jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and run unit tests
        working-directory: experiments/experiment-16-flask-todo-docker
        run: python -m pip install -r requirements.txt && python -m unittest -v
      - name: Build image
        run: docker build -t ghcr.io/${GITHUB_REPOSITORY,,}/campus-todos:${GITHUB_SHA::7} experiments/experiment-16-flask-todo-docker
      - name: Run container and verify persisted data after restart
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/campus-todos:${GITHUB_SHA::7}"
          docker volume create campus-todos-e19-data >/dev/null
          docker run -d --name campus-todos-e19 -p 127.0.0.1:5001:5000 -v campus-todos-e19-data:/data "$image"
          cleanup() { docker logs campus-todos-e19 || true; docker rm -f campus-todos-e19 >/dev/null 2>&1 || true; docker volume rm campus-todos-e19-data >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5001/health >/dev/null; then break; fi
            sleep 1
          done
          created=$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"title":"Persisted CI task"}' http://127.0.0.1:5001/api/todos)
          echo "$created" | grep -q 'Persisted CI task'
          docker restart campus-todos-e19 >/dev/null
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5001/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:5001/api/todos | grep -q 'Persisted CI task'
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${GITHUB_REPOSITORY,,}/campus-todos:${GITHUB_SHA::7}
      - name: Deployment gate
        if: github.event_name == 'push'
        run: echo 'Configure an approved protected deployment target before rollout.'
