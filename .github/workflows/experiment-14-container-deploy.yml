name: Experiment 14 - CampusConnect container publication
on:
  pull_request:
    paths:
      - experiments/experiment-11-static-site-docker-nginx/**
      - .github/workflows/experiment-14-container-deploy.yml
  push:
    branches: [main]
    paths:
      - experiments/experiment-11-static-site-docker-nginx/**
      - .github/workflows/experiment-14-container-deploy.yml
permissions:
  contents: read
  packages: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghcr.io/${GITHUB_REPOSITORY,,}/campusconnect:${GITHUB_SHA::7} experiments/experiment-11-static-site-docker-nginx
      - name: Run and verify the Nginx container
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/campusconnect:${GITHUB_SHA::7}"
          docker run -d --name campusconnect-e14 -p 127.0.0.1:8080:80 "$image"
          trap 'docker logs campusconnect-e14 || true; docker rm -f campusconnect-e14 >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q 'CampusConnect'
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz | grep -q 'ok'
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${GITHUB_REPOSITORY,,}/campusconnect:${GITHUB_SHA::7}
      - name: Deployment gate
        if: github.event_name == 'push'
        run: echo 'Image publication is complete; configure a protected deployment environment and target before rollout.'
