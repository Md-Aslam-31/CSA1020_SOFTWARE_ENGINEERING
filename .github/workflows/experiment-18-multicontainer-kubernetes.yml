name: Experiment 18 - StudySpark Kubernetes deployment

on:
  pull_request:
    paths:
      - experiments/experiment-18-kubernetes-multicontainer/**
      - .github/workflows/experiment-18-multicontainer-kubernetes.yml
  push:
    branches: [main]
    paths:
      - experiments/experiment-18-kubernetes-multicontainer/**
      - .github/workflows/experiment-18-multicontainer-kubernetes.yml

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run StudySpark API tests
        working-directory: experiments/experiment-18-kubernetes-multicontainer/backend
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest -v

      - uses: helm/kind-action@v1
        with:
          cluster_name: exp18

      - name: Build and load API and frontend containers
        run: |
          docker build -t studyspark-api:${GITHUB_SHA::7} experiments/experiment-18-kubernetes-multicontainer/backend
          docker build -t studyspark-frontend:${GITHUB_SHA::7} experiments/experiment-18-kubernetes-multicontainer/frontend
          kind load docker-image studyspark-api:${GITHUB_SHA::7} --name exp18
          kind load docker-image studyspark-frontend:${GITHUB_SHA::7} --name exp18

      - name: Deploy database, API, and frontend
        run: |
          set -euo pipefail
          mkdir -p evidence
          sed \
            -e "s|YOUR_REGISTRY/studyspark-api:1.0|studyspark-api:${GITHUB_SHA::7}|g" \
            -e "s|YOUR_REGISTRY/studyspark-frontend:1.0|studyspark-frontend:${GITHUB_SHA::7}|g" \
            experiments/experiment-18-kubernetes-multicontainer/k8s/studyspark.yaml > /tmp/studyspark-ci.yaml
          kubectl apply -f /tmp/studyspark-ci.yaml
          kubectl rollout status deployment/studyspark-db --timeout=180s
          kubectl rollout status deployment/studyspark-api --timeout=180s
          kubectl rollout status deployment/studyspark-frontend --timeout=180s
          kubectl get pods,services,pvc -o wide | tee evidence/cluster-state.txt
          kubectl port-forward service/api 5050:5000 > /tmp/exp18-api-forward.log 2>&1 &
          api_forward_pid=$!
          kubectl port-forward service/studyspark-frontend 8080:80 > /tmp/exp18-web-forward.log 2>&1 &
          web_forward_pid=$!
          trap 'kill "$api_forward_pid" "$web_forward_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5050/health >/dev/null && curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:5050/health | tee evidence/api-health.json
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"title":"Verify PostgreSQL-backed task"}' http://127.0.0.1:5050/api/tasks | tee evidence/task-create.json
          curl --fail --silent --show-error http://127.0.0.1:5050/api/tasks | tee evidence/task-list.json
          grep -q 'Verify PostgreSQL-backed task' evidence/task-list.json
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q 'StudySpark'
          kubectl scale deployment/studyspark-frontend --replicas=3
          kubectl rollout status deployment/studyspark-frontend --timeout=180s
          kubectl get pods,services,pvc -o wide | tee evidence/scaled-cluster-state.txt

      - name: Upload Kubernetes verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-18-kind-evidence
          path: evidence/
          if-no-files-found: warn
