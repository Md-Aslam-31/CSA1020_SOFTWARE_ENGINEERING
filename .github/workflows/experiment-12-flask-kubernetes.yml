name: Experiment 12 - Flask API, container, and Kubernetes

on:
  pull_request:
    paths:
      - experiments/experiment-12-flask-api-kubernetes/**
      - .github/workflows/experiment-12-flask-kubernetes.yml
  push:
    branches: [main]
    paths:
      - experiments/experiment-12-flask-api-kubernetes/**
      - .github/workflows/experiment-12-flask-kubernetes.yml

permissions:
  contents: read
  packages: write

jobs:
  verify-and-deploy-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Flask API unit tests
        working-directory: experiments/experiment-12-flask-api-kubernetes
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest -v

      - uses: helm/kind-action@v1
        with:
          cluster_name: exp12

      - name: Build and load the app image into kind
        run: |
          docker build -t campus-tasks-api:1.0 experiments/experiment-12-flask-api-kubernetes
          kind load docker-image campus-tasks-api:1.0 --name exp12

      - name: Deploy and exercise the NodePort application
        run: |
          set -euo pipefail
          mkdir -p evidence
          kubectl apply -f experiments/experiment-12-flask-api-kubernetes/k8s/api.yaml
          kubectl rollout status deployment/campus-tasks-api --timeout=180s
          kubectl get pods,services,deployments -o wide | tee evidence/cluster-resources.txt
          kubectl port-forward service/campus-tasks-api 5050:5000 > /tmp/exp12-port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5050/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:5050/health | tee evidence/health-response.json
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"title":"Verify kind deployment"}' http://127.0.0.1:5050/api/tasks | tee evidence/create-response.json
          curl --fail --silent --show-error http://127.0.0.1:5050/api/tasks | tee evidence/task-list-response.json
          grep -q 'Verify kind deployment' evidence/task-list-response.json

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image to GHCR
        if: github.event_name == 'push'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/campus-tasks-api:${GITHUB_SHA::7}"
          docker tag campus-tasks-api:1.0 "$image"
          docker push "$image"

      - name: Upload API and cluster evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-12-kind-evidence
          path: evidence/
          if-no-files-found: warn
