<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSA1020 Lab Studio · Kanban</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header><div><p class="eyebrow">CSA1020 · SOFTWARE ENGINEERING</p><h1>Lab Studio</h1><p>Move each work item through a visible, limited workflow.</p></div><button id="addTask" class="primary">＋ Add task</button></header>
<section class="toolbar"><label>⌕ <input id="filter" placeholder="Filter tasks or owners"></label><span id="boardSummary"></span><button id="restore" class="quiet">Restore sample board</button></section>
<section class="board"><div class="column" data-status="To Do"><div class="column-head"><div><span class="dot todo"></span><b>To do</b></div><span class="count"></span></div><div class="cards"></div><button class="add-inline" data-add="To Do">＋ Add a card</button></div>
<div class="column" data-status="In Progress"><div class="column-head"><div><span class="dot doing"></span><b>In progress</b></div><span class="count"></span></div><div class="cards"></div><button class="add-inline" data-add="In Progress">＋ Add a card</button></div>
<div class="column" data-status="Done"><div class="column-head"><div><span class="dot done"></span><b>Done</b></div><span class="count"></span></div><div class="cards"></div><button class="add-inline" data-add="Done">＋ Add a card</button></div></section>
<footer>Local Kanban simulation · Drag a card or use its status menu. <a href="https://trello.com/b/r3OtgFKJ/se-lab-campus-task-board">Open the Trello board</a>.</footer></main>
<dialog id="taskDialog"><form id="taskForm"><div class="dialog-head"><div><p class="eyebrow">WORK ITEM</p><h2 id="dialogTitle">Add a task</h2></div><button type="button" id="close" class="close">×</button></div><label>Title<input id="taskTitle" required maxlength="100"></label><label>Purpose<input id="taskDescription" maxlength="180" placeholder="What outcome should this task produce?"></label><div class="row"><label>Owner<input id="taskOwner" value="Mohamed"></label><label>Priority<select id="taskPriority"><option>High</option><option>Medium</option><option>Low</option></select></label></div><div class="row"><label>Status<select id="taskStatus"><option>To Do</option><option>In Progress</option><option>Done</option></select></label><label>Due date<input id="taskDue" type="date"></label></div><button class="primary" type="submit">Save card</button></form></dialog><script src="app.js"></script></body></html>
