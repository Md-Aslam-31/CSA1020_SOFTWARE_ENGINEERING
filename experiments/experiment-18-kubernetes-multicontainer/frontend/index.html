<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>StudySpark</title><link rel="stylesheet" href="styles.css"></head>
<body><main><p class="eyebrow">STUDYSPARK · CAMPUS LEARNING</p><h1>Your next step, made simple.</h1><p class="intro">A shared study checklist connected to a Flask API.</p><p id="demo-note" class="intro" hidden>Faculty preview mode: tasks are saved in this browser. The Flask and PostgreSQL services are not connected in this static preview.</p><section class="panel"><div class="panel-heading"><h2>Study tasks</h2><span id="status" class="status">Connecting…</span></div><form id="task-form"><label for="title">Add a task</label><div class="form-row"><input id="title" name="title" maxlength="200" placeholder="e.g. Review lecture notes" required><button>Add task</button></div></form><ul id="tasks" aria-live="polite"></ul></section></main>
<script>
const statusLabel=document.querySelector('#status');
const demoMode=new URLSearchParams(location.search).get('demo')==='1';
const storageKey='studyspark-faculty-demo-tasks';
document.querySelector('#demo-note').hidden=!demoMode;
async function loadTasks(){try{let rows;if(demoMode){rows=JSON.parse(localStorage.getItem(storageKey)||'[{"id":1,"title":"Review lecture notes"}]');statusLabel.textContent='Preview mode';statusLabel.className='status ready'}else{const response=await fetch('/api/tasks');if(!response.ok)throw new Error('API unavailable');rows=await response.json();statusLabel.textContent='Connected';statusLabel.className='status ready'}const list=document.querySelector('#tasks');list.replaceChildren();for(const task of rows){const item=document.createElement('li');item.textContent=task.title;list.append(item)}}catch{statusLabel.textContent='Unavailable';statusLabel.className='status error'}}
document.querySelector('#task-form').addEventListener('submit',async event=>{event.preventDefault();const title=document.querySelector('#title');if(demoMode){const rows=JSON.parse(localStorage.getItem(storageKey)||'[{"id":1,"title":"Review lecture notes"}]');rows.push({id:Date.now(),title:title.value.trim()});localStorage.setItem(storageKey,JSON.stringify(rows));title.value='';await loadTasks();return}const response=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value})});if(response.ok){title.value='';await loadTasks()}else{statusLabel.textContent='Could not add task'}});loadTasks();
</script></body></html>
