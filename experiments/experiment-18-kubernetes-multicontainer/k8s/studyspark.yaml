apiVersion: v1
kind: Secret
metadata: {name: studyspark-db}
type: Opaque
stringData:
  # Demo value only; replace it before applying. Prefer a managed cluster Secret.
  POSTGRES_PASSWORD: replace-before-deployment
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: studyspark-db}
spec:
  replicas: 1
  selector: {matchLabels: {app: studyspark-db}}
  template:
    metadata: {labels: {app: studyspark-db}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - {name: POSTGRES_DB, value: studyspark}
        - {name: POSTGRES_USER, value: studyspark}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: studyspark-db, key: POSTGRES_PASSWORD}}
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: studyspark-db-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: studyspark-db-data}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: db}
spec:
  selector: {app: studyspark-db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: studyspark-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: studyspark-api}}
  template:
    metadata: {labels: {app: studyspark-api}}
    spec:
      containers:
      - name: api
        image: YOUR_REGISTRY/studyspark-api:1.0
        ports: [{containerPort: 5000}]
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: studyspark-db, key: POSTGRES_PASSWORD}}
        - name: DATABASE_URL
          value: postgresql+psycopg://studyspark:$(POSTGRES_PASSWORD)@db:5432/studyspark
        readinessProbe: {httpGet: {path: /health, port: 5000}}
        livenessProbe: {httpGet: {path: /health, port: 5000}}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: studyspark-api}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: studyspark-frontend}
spec:
  replicas: 2
  selector: {matchLabels: {app: studyspark-frontend}}
  template:
    metadata: {labels: {app: studyspark-frontend}}
    spec:
      containers:
      - name: frontend
        image: YOUR_REGISTRY/studyspark-frontend:1.0
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: studyspark-frontend}
spec:
  type: NodePort
  selector: {app: studyspark-frontend}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
