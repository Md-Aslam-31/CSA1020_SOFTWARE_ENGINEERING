services:
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://studyspark:local-only-change-me@db:5432/studyspark
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studyspark
      POSTGRES_USER: studyspark
      POSTGRES_PASSWORD: local-only-change-me
    volumes: ["studyspark-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyspark -d studyspark"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  studyspark-db:
