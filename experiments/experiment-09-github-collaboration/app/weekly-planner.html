<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CampusNotes · Weekly planner</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#18324b;background:#f3f7fa;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 5%,#d8f3ed 0,transparent 24rem),#f3f7fa}
    main{width:min(960px,100% - 2rem);margin:3rem auto}.eyebrow{color:#127668;font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:clamp(2rem,5vw,3.25rem);letter-spacing:-.045em;margin:.45rem 0}.intro{color:#5d7183;max-width:58ch;line-height:1.6}
    .toolbar{display:flex;gap:.8rem;flex-wrap:wrap;margin:1.5rem 0}.toolbar input{flex:1;min-width:13rem}
    input,button{font:inherit}input[type=search]{border:1px solid #cfdae3;border-radius:12px;padding:.8rem 1rem;background:white;color:inherit}
    button{border:0;border-radius:11px;padding:.75rem 1rem;background:#126b63;color:white;font-weight:700;cursor:pointer}button:hover{background:#0b554e}
    .progress-card,.task{background:white;border:1px solid #e1e9ee;border-radius:18px;box-shadow:0 8px 26px #163b5510}
    .progress-card{padding:1.2rem 1.4rem;margin-bottom:1rem}.progress-line{height:9px;background:#e5eeef;border-radius:99px;overflow:hidden;margin-top:.75rem}
    .progress-line span{display:block;height:100%;width:0;background:linear-gradient(90deg,#15917f,#82d7ab);transition:width .35s ease}
    #tasks{display:grid;gap:.75rem}.task{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:1rem 1.2rem;animation:rise .35s both}
    .task input{width:1.2rem;height:1.2rem;accent-color:#127668}.task h2{font-size:1rem;margin:0 0 .25rem}.task p{margin:0;color:#687b8c;font-size:.9rem;line-height:1.45}
    .tag{font-size:.75rem;padding:.35rem .6rem;border-radius:99px;background:#eaf5f2;color:#17675c;white-space:nowrap}
    .task.done h2{text-decoration:line-through;color:#708292}.task.done{background:#f9fcfa}
    #empty{display:none;color:#687b8c;text-align:center;padding:2rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:600px){main{margin:2rem auto}.task{grid-template-columns:auto 1fr}.tag{grid-column:2}.toolbar button{width:100%}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main>
  <p class="eyebrow">CampusNotes · Study better, one week at a time</p>
  <h1>Your weekly plan</h1>
  <p class="intro">A small, searchable plan for keeping lectures, group work, and lab preparation in view. Check off work as you finish; your progress stays in this browser.</p>
  <div class="toolbar">
    <label class="sr-only" for="search">Search this week's tasks</label>
    <input id="search" type="search" placeholder="Search tasks or days…" autocomplete="off">
    <button id="reset" type="button">Reset this week</button>
  </div>
  <section class="progress-card" aria-label="Weekly progress">
    <strong id="progressText" aria-live="polite">0 of 4 tasks complete</strong>
    <div class="progress-line" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><span></span></div>
  </section>
  <section id="tasks" aria-label="Weekly tasks"></section>
  <p id="empty">No tasks match your search.</p>
</main>
<script>
  const initialTasks=[
    {id:"lecture",title:"Review lecture notes",day:"Monday",detail:"Summarise the key ideas from this week's software engineering lecture.",tag:"Study"},
    {id:"outline",title:"Draft the group project outline",day:"Wednesday",detail:"Agree the problem statement, roles, and first milestone with your team.",tag:"Team"},
    {id:"lab",title:"Prepare lab questions",day:"Friday",detail:"Bring two questions and the materials needed for the practical session.",tag:"Lab"},
    {id:"reflection",title:"Write a short weekly reflection",day:"Saturday",detail:"Record one thing learned and one topic to revisit next week.",tag:"Review"}
  ];
  const key="campusnotes-weekly-plan-v1";
  let done=new Set(JSON.parse(localStorage.getItem(key)||"[]"));
  const tasks=document.querySelector("#tasks"),search=document.querySelector("#search");
  function render(){
    const q=search.value.trim().toLowerCase();tasks.replaceChildren();
    const visible=initialTasks.filter(t=>(t.title+" "+t.day+" "+t.detail+" "+t.tag).toLowerCase().includes(q));
    visible.forEach((task,index)=>{
      const card=document.createElement("article");card.className="task"+(done.has(task.id)?" done":"");card.style.animationDelay=(index*45)+"ms";
      const check=document.createElement("input");check.type="checkbox";check.checked=done.has(task.id);check.id="task-"+task.id;check.setAttribute("aria-label","Mark "+task.title+" complete");
      check.addEventListener("change",()=>{check.checked?done.add(task.id):done.delete(task.id);localStorage.setItem(key,JSON.stringify([...done]));render()});
      const copy=document.createElement("div");const title=document.createElement("h2");title.textContent=task.title;const detail=document.createElement("p");detail.textContent=task.day+" · "+task.detail;copy.append(title,detail);
      const tag=document.createElement("span");tag.className="tag";tag.textContent=task.tag;card.append(check,copy,tag);tasks.append(card);
    });
    document.querySelector("#empty").style.display=visible.length?"none":"block";
    const count=done.size,progress=Math.round(count/initialTasks.length*100);
    document.querySelector("#progressText").textContent=count+" of "+initialTasks.length+" tasks complete";
    const bar=document.querySelector(".progress-line");bar.setAttribute("aria-valuenow",String(count));bar.querySelector("span").style.width=progress+"%";
  }
  search.addEventListener("input",render);
  document.querySelector("#reset").addEventListener("click",()=>{done.clear();localStorage.removeItem(key);render();search.focus()});
  render();
</script>
</body>
</html>
