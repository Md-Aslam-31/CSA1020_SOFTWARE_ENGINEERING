apiVersion: apps/v1
kind: Deployment
metadata: {name: campus-tasks-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: campus-tasks-api}}
  template:
    metadata: {labels: {app: campus-tasks-api}}
    spec:
      containers:
      - name: api
        image: campus-tasks-api:1.0
        ports: [{containerPort: 5000}]
        readinessProbe: {httpGet: {path: /health, port: 5000}}
        livenessProbe: {httpGet: {path: /health, port: 5000}}
---
apiVersion: v1
kind: Service
metadata: {name: campus-tasks-api}
spec:
  type: NodePort
  selector: {app: campus-tasks-api}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30500}]
